<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Google Advanced Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="logo">
            <h3>
                <span style="color:#4285F4">G</span>
                <span style="color:#EA4335">o</span>
                <span style="color:#FBBC05">o</span>
                <span style="color:#4285F4">g</span>
                <span style="color:#34A853">l</span>
                <span style="color:#EA4335">e</span>
            </h3>
        </div>
        <div class="filters">
                <h2>Advanced Search</h2>
                <h3>Locate pages with</h3>

            <div class="row">
                <label for="all">All these words:</label>
                <input type="text" id="all" name="all"> 
            </div> 

            <div class="row">
                <label for="exact">This exact expression or phrase:</label>
                <input type="text" id="exact" name="exact">
            </div>

            <div class="row">
                <label for="any">Any of these words:</label>
                <input type="text" id="any" name="any">
            </div>
            <div class="row">
                <label for="none">None of these words:</label>
                <input type="text" id="none" name="none">
            </div>

            <div class="row">
                <label for="site">Website or domain:</label>
                <input type="text" id="site" name="site">
            </div>

            <div class="filter6">
                    <label for="range1">Numbers ranging from:</label>

                <div class="range">
                    <input type="text" id="range1" name="as_nlo">
                    <span class="to">to</span>
                    <input type="text" id="range2" name="as_nhi">
                </div>
            </div>

                <h3>Next, limit your results by</h3>
                    
        </div>
        <div class="links">
            <a href="index.html">Back to Google Search</a>
        </div>
    </body>
</html>

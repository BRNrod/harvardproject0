<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Google Advanced Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="logo">
            <h3>
                <span style="color:#4285F4">G</span>
                <span style="color:#EA4335">o</span>
                <span style="color:#FBBC05">o</span>
                <span style="color:#4285F4">g</span>
                <span style="color:#34A853">l</span>
                <span style="color:#EA4335">e</span>
            </h3>
        </div>

        <form action="https://www.google.com/search" class="filters">
            <h2 style="color: #d93025">Advanced Search</h2>

            <div class="divider1">
                <hr>
            </div>

            <h3>Locate pages with...</h3>

            <div class="row">
                <label for="as_q">All these words:</label>
                <input type="text" id="as_q" name="as_q"> 
            </div> 

            <div class="row">
                <label for="as_epq">This exact expression or phrase:</label>
                <input type="text" id="as_epq" name="as_epq">
            </div>

            <div class="row">
                <label for="as_oq">Any of these words:</label>
                <input type="text" id="as_oq" name="as_oq">
            </div>
            <div class="row">
                <label for="as_eq">None of these words:</label>
                <input type="text" id="as_eq" name="as_eq">
            </div>

            <div class="row">
                <label for="site">Website or domain:</label>
                <input type="text" id="site" name="as_sitesearch">
            </div>

            <div class="filter6">
                <label for="range1">Numbers ranging from:</label>

                <div class="range">
                    <input type="text" id="range1" name="as_nlo">
                    <span class="to">to</span>
                    <input type="text" id="range2" name="as_nhi">
                </div>
            </div>

            <div class="divider2">
                <hr>
            </div>

            <div class="submit-container">
                <input type="submit" value="Advanced Search" class="btn-advanced">
            </div>
                    
        </form>
        
        <div class="links">
            <a href="index.html">Back to Google Search</a>
        </div>
    </body>
</html>
